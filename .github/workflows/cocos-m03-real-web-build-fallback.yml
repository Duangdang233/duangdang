name: Cocos M03 Real Web Build Fallback

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  COCOS_VERSION: 3.8.8
  SAMPLE_REPO: https://github.com/toss/apps-in-toss-cocos-examples.git
  SAMPLE_PROJECT: apps-in-toss-basic-example
  START_SCENE: a6992632-4514-4b0c-a01f-15639b762a4f

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip fallback]') }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Publish started status
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force generated | Out-Null
          @{status="started";run=$env:GITHUB_RUN_ID;commit=$env:GITHUB_SHA;at=(Get-Date).ToUniversalTime().ToString("o")} | ConvertTo-Json | Set-Content generated/cocos-fallback-status.json -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/cocos-fallback-status.json
          git commit -m "ci: fallback build started [skip fallback] [skip smoke] [skip cocos build]"
          git push origin HEAD:main

      - name: Prepare dependency-free Cocos project
        shell: pwsh
        run: |
          git clone --depth 1 $env:SAMPLE_REPO _cocos_examples
          $project = Join-Path $env:GITHUB_WORKSPACE "_cocos_examples/$env:SAMPLE_PROJECT"
          if (!(Test-Path (Join-Path $project "assets/game.scene"))) { throw "Cocos sample project missing" }
          $parts = Get-ChildItem "$env:GITHUB_WORKSPACE/cocos-build/m03-script.b64.*" | Sort-Object Name
          if ($parts.Count -ne 7) { throw "M03 payload incomplete" }
          $encoded = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $bytes = [Convert]::FromBase64String($encoded)
          $scriptDir = Join-Path $project "assets/Script"
          [IO.File]::WriteAllBytes((Join-Path $scriptDir "GetUserKeyForGameController.ts"), $bytes)
          Get-ChildItem $scriptDir -Filter *.ts | Where-Object { $_.Name -ne "GetUserKeyForGameController.ts" } | ForEach-Object {
            $className = $_.BaseName
            Set-Content $_.FullName "import { _decorator, Component } from 'cc';`nconst { ccclass } = _decorator;`n@ccclass('$className')`nexport class $className extends Component {}`n" -Encoding utf8
          }
          $packagePath = Join-Path $project "package.json"
          $pkg = Get-Content $packagePath -Raw | ConvertFrom-Json
          $pkg.name = "entrepreneur-life-m03-cocos-preview"
          $pkg.creator.version = $env:COCOS_VERSION
          $pkg.dependencies = [ordered]@{}
          $pkg.devDependencies = [ordered]@{}
          $pkg | ConvertTo-Json -Depth 20 | Set-Content $packagePath -Encoding utf8
          "COCOS_PROJECT=$project" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download Cocos Creator with official-domain fallback
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "CocosCreator-$env:COCOS_VERSION.zip"
          $urls = @(
            "https://download.cocos.com/CocosCreator/v3.8.8/CocosCreator-v3.8.8-win-010512.zip",
            "https://download.cocos.org/CocosCreator/v3.8.8/CocosCreator-v3.8.8-win-010512.zip"
          )
          foreach ($url in $urls) {
            Remove-Item $zip -Force -ErrorAction SilentlyContinue
            Write-Host "Trying $url"
            curl.exe -L --retry 2 --retry-delay 5 --connect-timeout 30 --max-time 1800 --fail -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36" -H "Referer: https://www.cocos.com/" --output $zip $url
            if ((Test-Path $zip) -and (Get-Item $zip).Length -gt 100MB) { break }
          }
          if (!(Test-Path $zip) -or (Get-Item $zip).Length -lt 100MB) { throw "Both official Cocos download domains failed" }
          $target = Join-Path $env:RUNNER_TEMP "CocosCreator-$env:COCOS_VERSION"
          Expand-Archive $zip -DestinationPath $target -Force
          $exe = Get-ChildItem $target -Filter CocosCreator.exe -Recurse | Select-Object -First 1
          if (!$exe) { throw "CocosCreator.exe not found" }
          "COCOS_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & $exe.FullName --version

      - name: Build real Web Mobile
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE "cocos-build.log"
          $arg = "platform=web-mobile;debug=true;buildPath=project://build;outputName=m03-web;startScene=$env:START_SCENE;logDest=$log"
          $p = Start-Process $env:COCOS_EXE -ArgumentList @("--project",$env:COCOS_PROJECT,"--build",$arg) -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 36) { if (Test-Path $log) { Get-Content $log -Tail 400 }; throw "Cocos CLI failed: $($p.ExitCode)" }
          $output = Join-Path $env:COCOS_PROJECT "build/m03-web"
          if (!(Test-Path (Join-Path $output "index.html"))) { if (Test-Path $log) { Get-Content $log -Tail 400 }; throw "index.html missing" }
          "COCOS_OUTPUT=$output" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify package and publish
        shell: pwsh
        run: |
          foreach ($file in @("index.html","application.js")) { if (!(Test-Path (Join-Path $env:COCOS_OUTPUT $file))) { throw "Missing $file" } }
          $proof = [ordered]@{source="Cocos Creator CLI";creatorVersion=$env:COCOS_VERSION;platform="web-mobile";run=$env:GITHUB_RUN_ID;commit=$env:GITHUB_SHA;builtAtUtc=(Get-Date).ToUniversalTime().ToString("o");oldHtmlUsed=$false}
          $proof | ConvertTo-Json | Set-Content (Join-Path $env:COCOS_OUTPUT "cocos-build-proof.json") -Encoding utf8
          Add-Content (Join-Path $env:COCOS_OUTPUT "index.html") "`n<!-- m03-build-source=cocos-creator-cli -->"
          New-Item -ItemType Directory -Force generated | Out-Null
          Compress-Archive -Path "$env:COCOS_OUTPUT/*" -DestinationPath generated/entrepreneur-life-m03-cocos-web-mobile.zip -Force
          Copy-Item (Join-Path $env:COCOS_OUTPUT "cocos-build-proof.json") generated/cocos-build-proof.json -Force
          @{status="succeeded";run=$env:GITHUB_RUN_ID;commit=$env:GITHUB_SHA;at=(Get-Date).ToUniversalTime().ToString("o")} | ConvertTo-Json | Set-Content generated/cocos-fallback-status.json -Encoding utf8
          git add generated/entrepreneur-life-m03-cocos-web-mobile.zip generated/cocos-build-proof.json generated/cocos-fallback-status.json
          git commit -m "build: publish genuine Cocos HTML [skip fallback] [skip smoke] [skip cocos build]"
          git push origin HEAD:main

      - name: Publish failure status
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force generated | Out-Null
          @{status="failed";run=$env:GITHUB_RUN_ID;commit=$env:GITHUB_SHA;at=(Get-Date).ToUniversalTime().ToString("o")} | ConvertTo-Json | Set-Content generated/cocos-fallback-status.json -Encoding utf8
          if (Test-Path cocos-build.log) { Copy-Item cocos-build.log generated/cocos-build-failure.log -Force }
          git add generated/cocos-fallback-status.json
          if (Test-Path generated/cocos-build-failure.log) { git add generated/cocos-build-failure.log }
          git commit -m "build: fallback failed [skip fallback] [skip smoke] [skip cocos build]"
          git push origin HEAD:main
