name: Trigger Cocos Fallback Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  trigger:
    if: ${{ !contains(github.event.head_commit.message, '[skip trigger]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dispatch fallback workflow explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o dispatch-response.txt -w "%{http_code}" -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/cocos-m03-real-web-build-fallback.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "HTTP $status"
          cat dispatch-response.txt || true
          if [ "$status" != "204" ]; then
            exit 1
          fi

      - name: Publish dispatch confirmation
        run: |
          mkdir -p generated
          printf '{"status":"dispatched","run":"%s","commit":"%s","workflow":"cocos-m03-real-web-build-fallback.yml"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > generated/cocos-trigger-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/cocos-trigger-status.json
          git commit -m "ci: fallback dispatch confirmed [skip trigger] [skip fallback] [skip smoke] [skip cocos build]"
          git push origin HEAD:main
