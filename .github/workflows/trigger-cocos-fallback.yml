name: Trigger Cocos Fallback Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    if: ${{ !contains(github.event.head_commit.message, '[skip trigger]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch fallback workflow explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/cocos-m03-real-web-build-fallback.yml/dispatches" \
            -d '{"ref":"main"}'
