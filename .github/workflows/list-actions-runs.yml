name: Export Recent Actions Runs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  export:
    if: ${{ !contains(github.event.head_commit.message, '[skip list runs]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p generated
          curl --fail-with-body -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30" \
            > generated/recent-actions-runs.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/recent-actions-runs.json
          git commit -m "ci: export recent Actions runs [skip list runs] [skip trigger] [skip fallback] [skip smoke] [skip cocos build] [skip 386 build] [skip clean build]"
          git pull --rebase origin main
          git push origin HEAD:main
