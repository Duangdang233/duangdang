name: Cocos M03 Clean Web Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  COCOS_VERSION: 3.8.6
  COCOS_URL: https://download.cocos.com/CocosCreator/v3.8.6/CocosCreator-v3.8.6-win-032501.zip
  SAMPLE_REPO: https://github.com/toss/apps-in-toss-cocos-examples.git
  SAMPLE_PROJECT: apps-in-toss-basic-example
  START_SCENE: a6992632-4514-4b0c-a01f-15639b762a4f

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip clean build]') }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prepare dependency-free Cocos project
        shell: pwsh
        run: |
          git clone --depth 1 $env:SAMPLE_REPO _cocos_examples
          $project = Join-Path $env:GITHUB_WORKSPACE "_cocos_examples/$env:SAMPLE_PROJECT"
          if (!(Test-Path (Join-Path $project "assets/game.scene"))) { throw "Cocos sample project missing" }
          $parts = Get-ChildItem "$env:GITHUB_WORKSPACE/cocos-build/m03-script.b64.*" | Sort-Object Name
          if ($parts.Count -ne 7) { throw "M03 payload incomplete" }
          $encoded = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $bytes = [Convert]::FromBase64String($encoded)
          $scriptDir = Join-Path $project "assets/Script"
          [IO.File]::WriteAllBytes((Join-Path $scriptDir "GetUserKeyForGameController.ts"), $bytes)
          $source = [Text.Encoding]::UTF8.GetString($bytes)
          if (!$source.Contains("@ccclass('GetUserKeyForGameController')") -or !$source.Contains("M03Walker")) { throw "M03 source integrity failure" }
          Get-ChildItem $scriptDir -Filter *.ts | Where-Object { $_.Name -ne "GetUserKeyForGameController.ts" } | ForEach-Object {
            $className = $_.BaseName
            Set-Content $_.FullName "import { _decorator, Component } from 'cc';`nconst { ccclass } = _decorator;`n@ccclass('$className')`nexport class $className extends Component {}`n" -Encoding utf8
          }
          $packagePath = Join-Path $project "package.json"
          $pkg = Get-Content $packagePath -Raw | ConvertFrom-Json
          $pkg.name = "entrepreneur-life-m03-cocos-preview"
          $pkg.creator.version = $env:COCOS_VERSION
          $pkg.dependencies = [ordered]@{}
          $pkg.devDependencies = [ordered]@{}
          $pkg | ConvertTo-Json -Depth 20 | Set-Content $packagePath -Encoding utf8
          "COCOS_PROJECT=$project" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download official Cocos Creator 3.8.6
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "CocosCreator-$env:COCOS_VERSION.zip"
          curl.exe -L --retry 4 --retry-delay 8 --connect-timeout 30 --max-time 2400 --fail -A "Mozilla/5.0" -H "Referer: https://www.cocos.com/" --output $zip $env:COCOS_URL
          if (!(Test-Path $zip) -or (Get-Item $zip).Length -lt 100MB) { throw "Cocos 3.8.6 archive missing or too small" }
          $target = Join-Path $env:RUNNER_TEMP "CocosCreator-$env:COCOS_VERSION"
          Expand-Archive $zip -DestinationPath $target -Force
          $exe = Get-ChildItem $target -Filter CocosCreator.exe -Recurse | Select-Object -First 1
          if (!$exe) { throw "CocosCreator.exe not found" }
          "COCOS_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & $exe.FullName --version

      - name: Build genuine Web Mobile
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE "cocos-build.log"
          $arg = "platform=web-mobile;debug=true;buildPath=project://build;outputName=m03-web;startScene=$env:START_SCENE;logDest=$log"
          $p = Start-Process $env:COCOS_EXE -ArgumentList @("--project",$env:COCOS_PROJECT,"--build",$arg) -Wait -PassThru -NoNewWindow
          Write-Host "Cocos Creator exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 36) { if (Test-Path $log) { Get-Content $log -Tail 500 }; throw "Cocos CLI failed" }
          $output = Join-Path $env:COCOS_PROJECT "build/m03-web"
          if (!(Test-Path (Join-Path $output "index.html"))) { if (Test-Path $log) { Get-Content $log -Tail 500 }; throw "index.html missing" }
          "COCOS_OUTPUT=$output" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify and stamp provenance
        shell: pwsh
        run: |
          foreach ($file in @("index.html","application.js")) { if (!(Test-Path (Join-Path $env:COCOS_OUTPUT $file))) { throw "Missing Cocos output $file" } }
          $proof = [ordered]@{source="Cocos Creator CLI";creatorVersion=$env:COCOS_VERSION;platform="web-mobile";run=$env:GITHUB_RUN_ID;commit=$env:GITHUB_SHA;builtAtUtc=(Get-Date).ToUniversalTime().ToString("o");oldHtmlUsed=$false;runtime="cc.Graphics + cc.Component + update(dt)"}
          $proof | ConvertTo-Json | Set-Content (Join-Path $env:COCOS_OUTPUT "cocos-build-proof.json") -Encoding utf8
          Add-Content (Join-Path $env:COCOS_OUTPUT "index.html") "`n<!-- m03-build-source=cocos-creator-cli-3.8.6 -->"
          Get-ChildItem $env:COCOS_OUTPUT -Recurse -File | ForEach-Object {"{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.FullName.Substring($env:COCOS_OUTPUT.Length + 1)} | Set-Content (Join-Path $env:COCOS_OUTPUT "sha256-manifest.txt") -Encoding utf8

      - name: Upload genuine Cocos Web Mobile
        uses: actions/upload-artifact@v4
        with:
          name: entrepreneur-life-m03-cocos-web-mobile-386
          path: ${{ env.COCOS_OUTPUT }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cocos-m03-clean-build-log
          path: cocos-build.log
          if-no-files-found: ignore
          retention-days: 3
